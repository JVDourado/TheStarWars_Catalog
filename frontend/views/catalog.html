<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Star Wars Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4" href="">The Star Wars Catalog</h1>

       <div class="row mb-4">
            <div class="col-md-6">
                <input type="text" id="search-bar" placeholder="Search films..." class="form-control shadow-sm">
            </div>
            <div class="col-md-6">
                <select id="sort-by" class="form-select shadow-sm">
                    <option value="">Sort by ...</option>
                    <option value="episode">Episode</option>
                    <option value="title">Title</option>
                    <option value="release_date">Release Date</option>
                </select>
            </div>
        </div>

        <ul id="film-list" class="list-group"></ul>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../assets/js/catalog.js"></script>
</body>
</html>
