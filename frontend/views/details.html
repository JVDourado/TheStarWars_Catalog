<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title"></title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <div id="film-details">

        <a href="catalog.html" class="btn btn-primary mb-3">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>

        <h1 id="film-title"></h1>

        <img id="film-poster" class="img-fluid">

        <div class="detail-container">

            <p id="film-episode" class="text-center"></p>
            <p id="film-sinopsis" class="text-center"></p>

            <div class="d-flex justify-content-between">
                <p id="film-releaseDate"></p>
                <p id="film-age"></p>
            </div>

            <div class="d-flex justify-content-between">
                <p id="film-director"></p>
                <p id="film-producers"></p>
            </div>

            <p id="film-characters"></p>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../assets/js/details.js"></script>
</body>
</html>
